[package]
name = "roch-sensors"
description = "Roch Monitor's sensor engine: Roch Viewer's hardware transports and Roch GPU's backends behind one polling engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
roch-core.workspace = true
libloading.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
roch-nvidia.workspace = true
roch-amd.workspace = true
roch-intel.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
]
