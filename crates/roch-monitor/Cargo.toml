[package]
name = "roch-monitor"
description = "Roch Monitor: live hardware sensors with current, minimum, maximum and average, in the style of HWiNFO and HWMonitor."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "RochMonitor"
path = "src/main.rs"

[dependencies]
roch-sensors.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg.workspace = true
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"
