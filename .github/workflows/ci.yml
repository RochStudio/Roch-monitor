name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything here runs without the inpoutx64 driver, a PawnIO install or a GPU: the hardware
  # transports are tested on their decoders and refusals, and the window through egui with no display.
  build-and-test:
    name: Build, test and package (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p roch-monitor

      # The command line on a machine with no driver: every source either reads or says why not.
      - name: Smoke-test the command line
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\RochMonitor.exe -ArgumentList '--dump','--seconds','2' `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput dump.txt -RedirectStandardError dump-err.txt
          Get-Content dump.txt
          if ($p.ExitCode -ne 0) { throw "RochMonitor --dump exited with $($p.ExitCode)" }
          if (-not (Select-String -Path dump.txt -Pattern '^\[CPU\]' -Quiet)) { throw 'no CPU section in the dump' }
          if (-not (Select-String -Path dump.txt -Pattern '^Sources' -Quiet)) { throw 'no Sources section in the dump' }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\RochMonitor.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.md dist\
          (Get-FileHash dist\RochMonitor.exe -Algorithm SHA256).Hash.ToLower() + ' *RochMonitor.exe' | Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: roch-monitor
          path: dist/
          retention-days: 14
