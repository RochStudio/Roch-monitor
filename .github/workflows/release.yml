name: Release

# Push a tag named for the workspace version (v1.0.0 for version = "1.0.0") to publish a GitHub
# release. CI's artifact expires after 14 days; a release's files stay.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The same format, lint, test, build, smoke test and package as every push.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with Cargo.toml would publish an exe whose --version says otherwise.
      - name: Check the tag against the workspace version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml's version ${version} (expected v${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: roch-monitor
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Roch Monitor ${{ steps.version.outputs.version }}" \
            --generate-notes
